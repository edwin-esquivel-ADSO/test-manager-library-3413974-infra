services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library}
      POSTGRES_DB: ${DB_DATABASE:-library}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-library}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - library-net

networks:
  library-net:
    driver: bridge

volumes:
  pgdata:
